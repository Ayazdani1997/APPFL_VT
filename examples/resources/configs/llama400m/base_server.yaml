client_configs:
  train_configs:
    trainer: "VanillaTrainer"
    mode: "step"
    num_local_steps: 1
    optim: "AdamW"
    optim_args:
      lr: 0.00001
      weight_decay: 0.01
    loss_fn: "CrossEntropyLoss"
    loss_fn_kwargs:
      ignore_index: -100
    metric_path: "./examples/resources/metric/token_accuracy.py"
    metric_name: "token_accuracy"
    do_validation: False
    train_batch_size: 4
    train_data_shuffle: True
    num_workers: 0
    clip_grad: True
    clip_value: 1.0
    clip_norm: 2
    optimize_memory: False

  model_configs:
    model_path: "./examples/resources/model/llama400m.py"
    model_name: "Llama400M"
    model_kwargs:
      model_dir: "/home/ahmadhossein/Llama-3.2-400M-Instruct-85k"
      torch_dtype: "float32"
      local_files_only: True
      gradient_checkpointing: True

server_configs:
  num_clients: 2
  scheduler: "SyncScheduler"
  scheduler_kwargs:
    same_init_model: True
  aggregator: "FedAvgAggregator"
  aggregator_kwargs:
    client_weights_mode: "sample_size"
  device: "cpu"
  num_global_epochs: 6
  logging_output_dirname: "./output/llama400m/base"
  logging_output_filename: "server"
  comm_configs:
    grpc_configs:
      server_uri: "localhost:50051"
      max_message_size: 4194304
      use_ssl: False
      use_model_chunking: True
      model_chunk_size: 4194304
    comm_logging_output_dirname: "./output/llama400m/base"
    comm_logging_output_filename: "comm_result"

    compressor_configs:
        enable_compression: True
        # Used if enable_compression is True
        lossy_compressor:  "SZ2Compressor"
        lossless_compressor: "blosc"
        error_bounding_mode: "REL"
        error_bound: 1e-10
        param_cutoff: 1024
        compression_logging_output_dirname: "./output/llama400m/base"
        compression_logging_output_filename: "compression_result"
